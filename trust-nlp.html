<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JupiterOne Semantic Q&A Search</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 15px; }
    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .qa {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 15px;
      box-shadow: 0 0 6px rgba(0,0,0,0.05);
    }
    .qa strong { display: block; margin-bottom: 8px; font-size: 18px; }
    .score {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
    }
  </style>
  <!-- TensorFlow.js and Universal Sentence Encoder -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.9.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder@1.3.3/dist/universal-sentence-encoder.min.js"></script>
</head>
<body>

  <h1>JupiterOne Semantic Q&A Search</h1>
  <input id="searchBox" placeholder="Ask a question, e.g. 'How do I reset my password?'" autocomplete="off" />
  <div id="results"><p>Type your question above to search.</p></div>

  <script>
    let qaData = [];
    let model = null;
    let queryEmbedding = null;

    async function loadQA() {
      const response = await fetch('jupiterone_qa_with_embeddings.json');
      qaData = await response.json();
      console.log(`Loaded ${qaData.length} Q&A items`);
      console.log("Sample embedding:", qaData[0]?.embedding);
    }

    async function loadModel() {
      model = await use.load();
      console.log('USE model loaded');
    }

    function cosineSimilarity(vecA, vecB) {
      let dot = 0.0, normA = 0.0, normB = 0.0;
      for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
        normA += vecA[i] * vecA[i];
        normB += vecB[i] * vecB[i];
      }
      return (normA === 0 || normB === 0) ? 0 : dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    async function embedQuery(query) {
      const embeddings = await model.embed([query]);
      const array = await embeddings.array();
      embeddings.dispose();
      return array[0];
    }

    async function search() {
      const query = document.getElementById('searchBox').value.trim();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (query.length < 3) {
        resultsDiv.innerHTML = '<p>Type at least 3 characters to search.</p>';
        return;
      }

      if (!model) {
        resultsDiv.innerHTML = '<p>Loading model, please wait...</p>';
        return;
      }

      console.log("Running search...");

      queryEmbedding = await embedQuery(query);

      const scored = qaData.map(item => {
        const vec = Array.isArray(item.embedding)
          ? item.embedding
          : JSON.parse(item.embedding);

        return {
          ...item,
          score: cosineSimilarity(queryEmbedding, vec)
        };
      });

      scored.sort((a, b) => b.score - a.score);
      const topResults = scored.slice(0, 5).filter(r => r.score > 0.1);

      if (topResults.length === 0) {
        resultsDiv.innerHTML = '<p>No matching results found.</p>';
        return;
      }

      topResults.forEach(({ question, answer, score }) => {
        const div = document.createElement('div');
        div.className = 'qa';
        div.innerHTML = `
          <strong>Q: ${question}</strong>
          <p>A: ${answer}</p>
          <div class="score">Similarity: ${score.toFixed(3)}</div>
        `;
        resultsDiv.appendChild(div);
      });
    }

    async function init() {
      await loadQA();
      await loadModel();

      let debounceTimeout;
      document.getElementById('searchBox').addEventListener('input', () => {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(search, 300);
      });
    }

    init();
  </script>

</body>
</html>
